<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Calculator - SIRIMATH</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #00ff00 0%, #ff00ff 50%, #00ffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            animation: neonGlow 2s ease-in-out infinite alternate;
        }
        @keyframes neonGlow {
            from { filter: brightness(1); }
            to { filter: brightness(1.2); }
        }
        .calculator {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
            text-align: center;
            width: 350px; /* Medium width */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        h1 {
            color: #00ff00;
            font-size: 3em; /* Medium title size */
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
            animation: textGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes textGlow {
            from { text-shadow: 0 0 10px #00ff00; }
            to { text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00, 0 0 40px #00ff00; }
        }
        #display {
            width: 100%;
            height: 70px; /* Medium display height */
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-size: 2.2em; /* Medium font size */
            text-align: right;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.5);
            animation: slideIn 0.5s ease-out;
            border: 2px solid #00ff00;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px; /* Medium gap */
        }
        button {
            height: 70px; /* Medium button height */
            font-size: 1.8em; /* Medium font size */
            border: none;
            border-radius: 12px;
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 255, 0, 0.3);
            border: 1px solid #00ff00;
        }
        button:hover {
            background: rgba(0, 255, 0, 0.5);
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 255, 0, 0.5);
            text-shadow: 0 0 5px #00ff00;
        }
        button:active {
            transform: scale(0.95);
            animation: pulse 0.2s ease;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }
        .operator {
            background: rgba(255, 0, 255, 0.5);
            color: #ff00ff;
            border-color: #ff00ff;
        }
        .operator:hover {
            background: rgba(255, 0, 255, 0.7);
            text-shadow: 0 0 5px #ff00ff;
        }
        .equal {
            background: rgba(0, 255, 255, 0.5);
            color: #00ffff;
            border-color: #00ffff;
            grid-column: span 2;
        }
        .equal:hover {
            background: rgba(0, 255, 255, 0.7);
            text-shadow: 0 0 5px #00ffff;
        }
        .clear {
            background: rgba(255, 0, 0, 0.5);
            color: #ff0000;
            border-color: #ff0000;
        }
        .clear:hover {
            background: rgba(255, 0, 0, 0.7);
            text-shadow: 0 0 5px #ff0000;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>SIRIMATH</h1>
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '';
        let operator = '';
        let previousInput = '';

        function appendToDisplay(value) {
            currentInput += value;
            display.value = currentInput;
        }

        function clearDisplay() {
            currentInput = '';
            operator = '';
            previousInput = '';
            display.value = '';
        }

        function calculate() {
            try {
                let result = eval(currentInput);
                display.value = result;
                currentInput = result.toString();
            } catch (error) {
                display.value = 'Error';
                currentInput = '';
            }
        }
    </script>
</body>
</html>
